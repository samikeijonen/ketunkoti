            - region "Mikä ihmeen Ketun koti?":
              - paragraph [ref=f3e33]: Ketun koti on ensinnäkin hieno nimi, olenhan sen ihan itse keksinyt.
              - paragraph [ref=f3e34]: Ketun koti myy kauniita koteja sekä asuntosijoittajille että omaksi kodiksi. Vielä Ketun koti ei ole kiinteistönvälitykseen keskittyvä yritys mutta voimme kyllä auttaa kodin myymisessä (valokuvaus, markkinointi jne).
