            - region "Kuka on Ketun kodin takana?":
              - paragraph [ref=f7e40]: Ketun kodin takana ei yllättäen olekaan nainen! Vaan minä, Sami Keijonen. Ymmärrän pettymyksen.
              - figure [ref=f7e41]:
                - img "Sami kuuntelee musiikkia silmät kiinni Ilosaarirokissa, katse kohti taivasta ja nyrkki ilmassa. Kuva on mustavalkoinen." [ref=f7e42]
              - paragraph [ref=f7e43]: Olen entinen matematiikan opettaja (ja apulaisrehtori ja Espoon kesälukion rehtori) ja siirryin pikkuhiljaa yrittäjäksi verkkosivustojen maailmaan.
              - paragraph [ref=f7e44]: Asuntosijoittaminen ja vuokranantajuus alkoi vuonna 2022 ja muodostui osaksi yrittäjyyttä. On sen verran mukavaa hommaa.
