name: Deploy to production

# Deploys the theme and the custom plugin to the server over SSH whenever
# something lands on main, which includes merged pull requests.
#
# Required repository secrets:
#   SSH_HOST         Server hostname, for example ketunkoti.fi
#   SSH_USER         SSH user to connect as
#   SSH_PORT         SSH port (optional, defaults to 22)
#   SSH_PRIVATE_KEY  Full contents of the deploy private key file, including
#                    the BEGIN and END lines. Must have no passphrase, since
#                    the runner cannot type one. Use a key created for this
#                    deploy only, never a personal key.
#   SSH_KNOWN_HOSTS  Output of: ssh-keyscan -p <port> <host>
#   DEPLOY_PATH      Absolute path to wp-content on the server, no trailing slash
#
# The deploy writes only inside DEPLOY_PATH/themes/ketunkoti and
# DEPLOY_PATH/plugins/ketunkoti-features. Nothing else on the server is touched.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would change without transferring anything'
        type: boolean
        default: false

# Never let two deploys write to the server at the same time. Queue instead of
# cancelling, so a run that is already uploading is allowed to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and sync
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build theme and plugin assets
        run: npm run build

      # A missing secret would otherwise expand to an empty string and send
      # rsync --delete at the wrong path. Fail loudly instead.
      - name: Verify deployment secrets are present
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=''
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            exit 1
          fi
          # rsync over SSH resolves "~/x" and bare "x" against the login
          # directory, so those are valid. Only refuse values that would send
          # --delete somewhere catastrophic.
          case "$DEPLOY_PATH" in
            /|//|'~'|'~/')
              echo "::error::DEPLOY_PATH points at the filesystem root or the bare home directory"
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key rather than StrictHostKeyChecking=no, so a swapped
          # server key aborts the deploy instead of trusting it silently.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # rsync would otherwise fail with an opaque "Host key verification
      # failed" and exit 255. Check the entry up front and say what is wrong.
      - name: Verify the host key matches the target host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail

          # known_hosts identifies non-default ports as "[host]:port".
          lookup="$SSH_HOST"
          if [ "$SSH_PORT" != '22' ]; then
            lookup="[${SSH_HOST}]:${SSH_PORT}"
          fi

          echo 'Key types present in SSH_KNOWN_HOSTS:'
          awk '{ print "  - " $2 }' "$HOME/.ssh/known_hosts" | sort -u

          if ! ssh-keygen -F "$lookup" -f "$HOME/.ssh/known_hosts" > /dev/null; then
            echo '::error::SSH_KNOWN_HOSTS has no entry for the host this workflow connects to. The host name in the secret must match SSH_HOST exactly - an entry for the IP will not match a host name, and vice versa. Regenerate it with: ssh-keyscan -p <port> <the exact SSH_HOST value>'
            exit 1
          fi

          echo 'Host key entry found for the target host.'

      - name: Sync theme and plugin
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # A trailing slash here would produce "path//themes/..."; harmless on
          # POSIX but confusing in logs, so normalise it away.
          DEPLOY_PATH="${DEPLOY_PATH%/}"

          RSYNC_FLAGS='-rlptz --delete --human-readable --itemize-changes'
          if [ "${DRY_RUN:-false}" = 'true' ]; then
            echo '::notice::Dry run - no files will be transferred'
            RSYNC_FLAGS="$RSYNC_FLAGS --dry-run"
          fi

          # Trailing slashes are load bearing: "src/" copies the contents of
          # src into the destination rather than nesting src inside it.
          sync() {
            local source="$1"
            local target="$2"
            echo "--- $source -> $target"
            rsync $RSYNC_FLAGS \
              --exclude='.git*' \
              --exclude='node_modules/' \
              --exclude='.DS_Store' \
              -e "ssh -p ${SSH_PORT} -i ${HOME}/.ssh/deploy_key -o UserKnownHostsFile=${HOME}/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
              "$source" "${SSH_USER}@${SSH_HOST}:${target}"
          }

          sync 'themes/ketunkoti/' "${DEPLOY_PATH}/themes/ketunkoti/"
          sync 'plugins/ketunkoti-features/' "${DEPLOY_PATH}/plugins/ketunkoti-features/"

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
